name: Build BatteryTemp deb

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz perl || true

      - name: Install Theos + 14.5 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos
          mkdir -p $HOME/theos/sdks
          gh release download -R theos/sdks -p "iPhoneOS14.5.sdk.tar.xz" -D /tmp
          tar -xJf /tmp/iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks/
          ln -sf "$HOME/theos/sdks/iPhoneOS14.5.sdk" "$HOME/theos/sdks/iPhoneOS14.0.sdk"

      - name: Build with Theos (compile only, manual stage)
        run: |
          export THEOS=$HOME/theos
          rm -rf .theos
          make
          echo "=== build output ==="
          find .theos -type f 2>/dev/null | head -50

      - name: Package deb manual (TweakInject stage)
        run: |
          set -e
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          mkdir -p stage/DEBIAN

          # ---- TweakInject：dylib + 对应的 Filter plist（roothide 真正扫描的注入目录）----
          mkdir -p stage/var/jb/usr/lib/TweakInject
          cp .theos/obj/debug/BatteryTemp.dylib stage/var/jb/usr/lib/TweakInject/ 2>/dev/null || \
          cp .theos/obj/BatteryTemp.dylib stage/var/jb/usr/lib/TweakInject/ || { echo "FATAL: BatteryTemp.dylib not found"; exit 1; }
          cp layout/Library/MobileSubstrate/DynamicLibraries/BatteryTemp.plist stage/var/jb/usr/lib/TweakInject/

          # ---- PreferenceBundles：先铺 layout（手写 Info/Root.plist），再单独拷 theos 产出的可执行文件 ----
          mkdir -p stage/var/jb/Library/PreferenceBundles
          cp -R layout/Library/PreferenceBundles/BatteryTempPrefs.bundle stage/var/jb/Library/PreferenceBundles/
          cp .theos/obj/debug/BatteryTempPrefs.bundle/BatteryTempPrefs stage/var/jb/Library/PreferenceBundles/BatteryTempPrefs.bundle/ 2>/dev/null || \
          cp .theos/obj/BatteryTempPrefs.bundle/BatteryTempPrefs stage/var/jb/Library/PreferenceBundles/BatteryTempPrefs.bundle/ || { echo "FATAL: BatteryTempPrefs executable not found"; exit 1; }

          # ---- PreferenceLoader 入口 ----
          mkdir -p stage/var/jb/Library/PreferenceLoader/Preferences
          cp layout/Library/PreferenceLoader/Preferences/BatteryTempEntry.plist stage/var/jb/Library/PreferenceLoader/Preferences/

          # ---- 自检 ----
          test -f stage/var/jb/Library/PreferenceBundles/BatteryTempPrefs.bundle/BatteryTempPrefs || { echo "FATAL: prefs executable missing"; exit 1; }
          test -f stage/var/jb/Library/PreferenceBundles/BatteryTempPrefs.bundle/Root.plist || { echo "FATAL: Root.plist missing"; exit 1; }
          plutil -extract NSPrincipalClass raw stage/var/jb/Library/PreferenceBundles/BatteryTempPrefs.bundle/Info.plist

          # ---- 假签名兜底 ----
          find stage -type f \( -name "*.dylib" -o -name "BatteryTempPrefs" \) -exec ldid -S {} \;

          # ---- DEBIAN：control + postinst(respring) ----
          cp control stage/DEBIAN/control
          sed -i '' "s/^Version:.*/Version: $VERSION/" stage/DEBIAN/control
          echo "" >> stage/DEBIAN/control
          cp layout/DEBIAN/postinst stage/DEBIAN/postinst
          chmod 755 stage/DEBIAN/control stage/DEBIAN/postinst

          echo "=== stage layout ==="
          find stage -type f

          mkdir -p packages
          dpkg-deb --root-owner-group -b stage packages/com.yzdmm.batterytemp_${VERSION}_iphoneos-arm64.deb
          echo "=== deb ==="
          ls -la packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryTemp-deb
          path: packages/*.deb